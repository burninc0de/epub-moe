name: Feature request
description: Suggest an idea for epub-moe
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Start with the problem.** Tell us what you are trying to do, what fails today, and what you expected instead. A concrete example is more useful than a feature name.

        epub-moe fine-tunes timing in structurally sound media overlays. Please read the [readme](https://github.com/burninc0de/epub-moe#what-this-does-well) before filing: structural repair (shuffled audio, chapters spread over several audio files, broken SMIL) is upstream work, not a feature request.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what fails today?
      description: Describe the workflow and the concrete failure, with an example if you have one.
      placeholder: "I load a Storyteller EPUB, … but … happens. I expected …"
    validations:
      required: true

  - type: checkboxes
    id: preconditions
    attributes:
      label: Before you file
      description: These are the assumptions epub-moe's diagnostics rely on.
      options:
        - label: The EPUB plays correctly in an EPUB 3 reader before I open it in epub-moe.
          required: true
        - label: I have read the readme's scope and input assumptions (one audio file per chapter, resolvable text references, contiguous or deliberately spaced timings).
          required: true

  - type: input
    id: producer
    attributes:
      label: What produced the EPUB, and with which version?
      description: For example Storyteller 3.0.0-beta.59, Sigil, or hand-built.
      placeholder: "Storyteller 3.0.0-beta.59"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Can you share the book or a minimal reproduction?
      description: A failing EPUB (or the OPF, the affected SMIL, and one chapter's audio) is what makes a fix possible. Say what you can share here; do not attach copyrighted material to the issue — email the maintainer if needed.
      placeholder: "I can share the EPUB / the OPF and SMIL / a minimal repro / only a description"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution idea (optional)
      description: If you have one. A clear problem description is more useful than a feature name.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that helps.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Please note:** this is a personal tool. Feature requests are welcome, but the maintainer is a writer first and developer second and may not be able to implement everything. Requests without a concrete failure or a reproduction may be closed.
