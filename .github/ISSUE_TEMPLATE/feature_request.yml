name: Feature request
description: Suggest an idea for epub-moe
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Start with the problem.** What are you trying to accomplish, and what does the current workflow force you to do instead? A concrete example is more useful than a feature name.

        epub-moe fine-tunes timing in structurally sound media overlays. Please read the [readme](https://github.com/burninc0de/epub-moe#what-this-does-well) before filing: structural repair (shuffled audio, chapters spread over several audio files, broken SMIL) is upstream work, not a feature request.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow, what you do today instead, and why that isn't good enough. An example helps.
      placeholder: "I want to … Today I … which means …"
    validations:
      required: true

  - type: checkboxes
    id: preconditions
    attributes:
      label: Before you file
      description: These are the assumptions epub-moe's diagnostics rely on.
      options:
        - label: "My book matches epub-moe's input assumptions: one audio file per chapter, SMIL text references that resolve, and fragments that are already roughly aligned."
          required: true

  - type: dropdown
    id: sample
    attributes:
      label: What can you share?
      description: A book, the OPF + affected SMIL, or a minimal sample makes the request actionable. Do not attach copyrighted material — email the maintainer if needed.
      options:
        - I can share the EPUB
        - I can share the OPF and the affected SMIL
        - I can share a minimal sample
        - I can describe it, but cannot share files
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution idea (optional)
      description: If you have one. A clear problem description is more useful than a feature name.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or anything else that helps.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Please note:** this is a personal tool. Feature requests are welcome, but the maintainer is a writer first and developer second and may not be able to implement everything. Requests without a concrete use case or a sample may be closed.
